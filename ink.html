<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>聊天室</title>
<style>html,body{margin:0;padding:0;height:100%;background:#fff8ec;overflow:hidden}
#load{position:fixed;left:0;right:0;top:50%;margin-top:-16px;text-align:center;font:26px/1 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#C9A46B;letter-spacing:4px}
#load span{opacity:.25;animation:bl 1.2s infinite}
#load span:nth-child(2){animation-delay:.2s}
#load span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
iframe{width:100%;height:100%;border:0;display:block}
</style></head><body>
<div id="load"><span>·</span><span>·</span><span>·</span></div>
<script>
(function () {
  var c = '', u = '';
  try { c = new URLSearchParams(location.search).get('c') || ''; } catch (e) { c = ''; }
  try { u = decodeURIComponent(escape(atob(c.replace(/-/g, '+').replace(/_/g, '/')))); } catch (e) { u = ''; }
  var l = document.getElementById('load');
  if (!/^https?:\/\//i.test(u)) { l.textContent = '链接无效或已失效'; return; }
  try {
    var origin = new URL(u).origin;
    var pc = document.createElement('link');
    pc.rel = 'preconnect'; pc.href = origin; pc.crossOrigin = '';
    document.head.appendChild(pc);
    var dns = document.createElement('link');
    dns.rel = 'dns-prefetch'; dns.href = origin;
    document.head.appendChild(dns);
  } catch (e) {}
  var f = document.createElement('iframe');
  f.setAttribute('allow', 'fullscreen; autoplay; clipboard-write; camera; microphone; display-capture');
  f.setAttribute('referrerpolicy', 'no-referrer');
  f.src = u;
  f.onload = function () { if (l && l.parentNode) l.parentNode.removeChild(l); };
  document.body.appendChild(f);
  setTimeout(function () { if (l && l.parentNode) l.parentNode.removeChild(l); }, 2500);
})();
</script></body></html>
