<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>聊天室</title><!-- 微信顶栏沿用这个标题: 写站点名, 别写加载文案 -->
<style>html,body{margin:0;height:100%;background:#fff8ec;overflow:hidden}
#go{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
width:210px;height:48px;border:0;border-radius:8px;background:#B45309;color:#fff;
font:16px/48px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;text-align:center}</style>
</head><body>
<button id="go" type="button">点这里进入</button>
<script>
(function(){
  var c = '', u = '';
  try { c = new URLSearchParams(location.search).get('c') || ''; } catch (e) { c = ''; }
  try { u = decodeURIComponent(escape(atob(c.replace(/-/g, '+').replace(/_/g, '/')))); } catch (e) { u = ''; }
  var go = document.getElementById('go'), jumped = false;
  if (!/^https?:\/\//i.test(u)) { go.textContent = '链接无效或已失效'; go.style.display = 'block'; return; }
  function jump(){ if (jumped) return; jumped = true; location.replace(u); }
  try { jump(); } catch (e) {}
  setTimeout(function () { if (document.visibilityState === 'visible') go.style.display = 'block'; }, 1500);
  go.addEventListener('click', jump, false);
  window.addEventListener('pagehide', function () { jumped = true; }, false);
})();
</script></body></html>
